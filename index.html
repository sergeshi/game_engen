function geo(t){if(t==='Wall')return new THREE.BoxGeometry(4,2.5,.25);if(t==='Floor')return new THREE.BoxGeometry(4,.08,4);if(t==='Sphere')return new THREE.SphereGeometry(.5,20,14);if(t==='Cylinder')return new THREE.CylinderGeometry(.5,.5,1,20);if(t==='Capsule')return new THREE.CapsuleGeometry(.35,1,5,12);if(t==='Stairs')return new THREE.BoxGeometry(1,1,1);return new THREE.BoxGeometry(1,1,1)}
function init(){try{scene=new THREE.Scene();scene.background=new THREE.Color('#242832');scene.fog=new THREE.Fog('#242832',40,130);camera=new THREE.PerspectiveCamera(45,1,.1,500);camera.position.set(11,15,18);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;$('#viewport').appendChild(renderer.domElement);composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));bloomPass=new UnrealBloomPass(new THREE.Vector2(1,1),.9,.45,.78);composer.addPass(bloomPass);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.maxPolarAngle=Math.PI*.48;ambient=new THREE.HemisphereLight(0xc6d9ff,0x39302b,1.7);scene.add(ambient);sun=new THREE.DirectionalLight(0xffe5c2,2);sun.position.set(8,16,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun,root,lightRoot);applyGlobalLighting();const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#30353c',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.05;floor.receiveShadow=true;floor.name='__runtimeGround';floor.userData.runtimeGround=true;scene.add(floor);grid=new THREE.GridHelper(100,100,'#667080','#3a404a');grid.position.y=-.025;scene.add(grid);transform=new TransformControls(camera,renderer.domElement);transform.addEventListener('dragging-changed',e=>controls.enabled=!e.value);transform.addEventListener('objectChange',()=>{const o=selected();if(o){record(o);syncTransform();dirty()}});scene.add(transform.getHelper());raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();clock=new THREE.Clock();renderer.domElement.addEventListener('pointermove',e=>{if(!S.play||!runtimePlayer)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/Math.max(r.width,1)*2-1,-(e.clientY-r.top)/Math.max(r.height,1)*2+1);raycaster.setFromCamera(mouse,camera);const targets=runtimeWidgetHighlights.map(h=>h.object);const hits=targets.length?raycaster.intersectObjects(targets,true):[];hoveredWidgetId='';if(hits.length){let o=hits[0].object;while(o&&o.parent!==root&&o.parent!==scene)o=o.parent;const hit=runtimeWidgetHighlights.find(h=>h.object===o||h.object.getObjectById(hits[0].object.id));if(hit)hoveredWidgetId=hit.widget.id}});renderer.domElement.addEventListener('pointerdown',e=>{if(S.play&&runtimePlayer){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/Math.max(r.width,1)*2-1,-(e.clientY-r.top)/Math.max(r.height,1)*2+1);raycaster.setFromCamera(mouse,camera);const npcHits=raycaster.intersectObjects(runtimeNPCs.map(n=>n.visual),true);if(npcHits.length){const hit=npcHits[0].object;const npc=runtimeNPCs.find(n=>n.visual===hit||n.visual.getObjectById(hit.id));if(npc){pendingTalk=npc;if(Math.hypot(npc.visual.position.x-runtimePlayer.position.x,npc.visual.position.z-runtimePlayer.position.z)<2.5)showTalkWidget(npc);else{const away=new THREE.Vector3(runtimePlayer.position.x-npc.visual.position.x,0,runtimePlayer.position.z-npc.visual.position.z);if(away.lengthSq()<.01)away.set(1,0,0);away.normalize();setRuntimeDestination(npc.visual.position.clone().addScaledVector(away,1.65));}return}}const targets=runtimeWidgetHighlights.map(h=>h.object);const ih=targets.length?raycaster.intersectObjects(targets,true):[];if(ih.length){let obj=ih[0].object;while(obj&&obj.parent!==root&&obj.parent!==scene)obj=obj.parent;const entry=runtimeWidgetHighlights.find(h=>h.object===obj||h.object.getObjectById(ih[0].object.id));if(entry){pendingWidget=entry;const d=Math.hypot(entry.object.position.x-runtimePlayer.position.x,entry.object.position.z-runtimePlayer.position.z);if(d<2.5)showInteractionWidget(entry.widget);else{const away=new THREE.Vector3(runtimePlayer.position.x-entry.object.position.x,0,runtimePlayer.position.z-entry.object.position.z);if(away.lengthSq()<.01)away.set(1,0,0);away.normalize();setRuntimeDestination(entry.object.position.clone().addScaledVector(away,1.5))}return}}const ground=scene.getObjectByName('__runtimeGround')||scene.children.find(o=>o.isMesh&&o.geometry?.type==='PlaneGeometry');if(ground){const hits=raycaster.intersectObject(ground,true);if(hits.length)setRuntimeDestination(hits[0].point)}return}pick(e)});window.addEventListener('error',e=>{console.error(e.error||e.message);if(!renderer){status('JavaScript error · see viewport message');const v=$('#viewport');if(v&&!v.querySelector('#bootError')){v.innerHTML='<div style="padding:24px;color:#fff;font:14px system-ui"><h2 style="color:#f2a65a">Could not initialize 3D viewport</h2><pre id="bootError" style="white-space:pre-wrap;color:#ffb5a9"></pre></div>';$('#bootError').textContent=e.error?.stack||e.message}}});window.addEventListener('resize',resize);if(window.ResizeObserver){new ResizeObserver(()=>resize()).observe($('#viewport'))}addObject('Box',new THREE.Vector3(-1,0.5,0));addObject('Capsule',new THREE.Vector3(1,0.85,0));resize();requestAnimationFrame(()=>{resize();requestAnimationFrame(resize)});animate();status('3D viewport initialized · WebGL active')}catch(err){console.error('GAME ENGEN initialization failed',err);const v=$('#viewport');v.innerHTML='<div style="padding:24px;color:#fff;font:14px system-ui"><h2 style="color:#f2a65a">3D viewport failed to start</h2><p id="bootError"></p><p style="color:#aeb6c2">Check WebGL support and network access to cdn.jsdelivr.net, then reload the page.</p></div>';$('#bootError').textContent=err?.stack||err?.message||String(err);status('3D initialization error')}}
function applyGlobalLighting(){if(ambient){ambient.intensity=globalLighting.enabled?globalLighting.ambient:0;ambient.visible=globalLighting.enabled}if(sun){sun.intensity=globalLighting.enabled?globalLighting.sun:0;sun.visible=globalLighting.enabled;sun.castShadow=globalLighting.enabled&&globalLighting.shadows}if(renderer)renderer.shadowMap.enabled=globalLighting.enabled&&globalLighting.shadows;if(scene)scene.traverse(o=>{if(o.isLight&&o!==ambient&&o!==sun){o.visible=globalLighting.enabled;if(o.isPointLight||o.isSpotLight)o.castShadow=globalLighting.enabled&&globalLighting.shadows}})}

function addObject(type='Box',position){snapshot();const id='o'+Math.random().toString(36).slice(2,9),m=S.materials[0];let obj;if(type==='Stairs'){obj=new THREE.Group();for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1,.2,.2),new THREE.MeshStandardMaterial({color:m.color}));s.position.set(0,.1+i*.2,-.4+i*.2);s.castShadow=s.receiveShadow=true;s.userData.stairStep=true;obj.add(s)}}else obj=new THREE.Mesh(geo(type),new THREE.MeshStandardMaterial({color:m.color,roughness:m.roughness,metalness:m.metalness,emissive:m.glow?(m.emissiveColor||'#ffffff'):'#000000',emissiveIntensity:m.glow?Math.max(0,m.emissiveStrength??1):0}));obj.name=type+' '+(S.objects.filter(o=>o.type===type).length+1);obj.userData={id,type,materialId:m.id,role:type==='Capsule'?'npc':'none',dialogueId:'start'};obj.castShadow=obj.receiveShadow=true;obj.position.copy(position||new THREE.Vector3((Math.random()-.5)*4,type==='Wall'?1.25:type==='Floor'?.04:type==='Stairs'?0:.5,(Math.random()-.5)*4));root.add(obj);S.objects.push({id,name:obj.name,type,role:obj.userData.role,dialogueId:'start',position:obj.position.toArray(),rotation:[0,0,0],scale:[1,1,1],materialId:m.id});select(id);hierarchy();dirty();return obj}
function selected(){return [...root.children,...lightRoot.children].find(o=>o.userData.id===S.selected)}function record(o){const r=S.objects.find(x=>x.id===o.userData.id);if(r){r.position=o.position.toArray();r.rotation=[o.rotation.x,o.rotation.y,o.rotation.z];r.scale=o.scale.toArray()}const l=S.lights.find(x=>x.id===o.userData.id);if(l)l.position=o.position.toArray()}
function select(id){S.selected=id;const o=selected();if(o&&transform)transform.attach(o);else transform?.detach();hierarchy();if(S.lights.some(l=>l.id===id))lightInspector(S.lights.find(l=>l.id===id));else inspector()}
function pick(e){if(S.mode!=='level'||S.play||transform?.dragging||transform?.axis)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/Math.max(r.width,1)*2-1,-(e.clientY-r.top)/Math.max(r.height,1)*2+1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects([...root.children,...lightRoot.children],true);const hit=hits.find(h=>{let n=h.object;while(n&&n!==scene){if(n.userData?.id)return true;n=n.parent}return false});if(hit){let o=hit.object;while(o&&!o.userData?.id)o=o.parent;if(o){select(o.userData.id);status('Selected '+o.name)}}else select(null)}
function hierarchy(){const b=$('#leftBody');if(S.mode==='widgets'){b.innerHTML='<div class="section">Interactive widgets</div>'+S.widgets.map(w=>'<div class="tree '+(w.id===S.selected?'sel':'')+'" data-widget="'+esc(w.id)+'">▣ <span>'+esc(w.name||w.label||'Widget')+'</span><small>'+esc(w.action||'dialogue')+'</small></div>').join('')+'<div class="divider"></div><button id="addWidget" class="primary" style="width:100%">＋ New widget</button><button id="autoWidgets" style="width:100%;margin-top:6px">✧ Make scene objects interactive</button><p class="muted small">Widgets are attached to scene objects. Their outlines appear in Play Test; approach an object to see its action prompt.</p>';b.querySelectorAll('[data-widget]').forEach(e=>e.onclick=()=>{S.selected=e.dataset.widget;hierarchy();inspector()});$('#addWidget').onclick=()=>{const o=S.objects.find(x=>!S.widgets.some(w=>w.objectId===x.id))||S.objects[0];const w={id:'w'+Math.random().toString(36).slice(2,8),name:'Interactive '+(S.widgets.length+1),label:'Interact',objectId:o?.id||'',action:'dialogue',dialogueId:S.dialogs[0]?.id||'start',message:'',color:'#f2a65a'};S.widgets.push(w);S.selected=w.id;snapshot();hierarchy();inspector();dirty()};$('#autoWidgets').onclick=()=>{let count=0;S.objects.forEach(o=>{if(!S.widgets.some(w=>w.objectId===o.id)){S.widgets.push({id:'w'+Math.random().toString(36).slice(2,8),name:o.name,label:'E · Interact',objectId:o.id,action:'dialogue',dialogueId:o.dialogueId||S.dialogs[0]?.id||'start',message:'',color:'#f2a65a'});count++}});S.selected=S.widgets[0]?.id||null;snapshot();hierarchy();inspector();dirty();status('Made '+count+' interactive objects')};return}if(S.mode==='dialogue'){b.innerHTML='<div class="section">Dialogue nodes</div>'+S.dialogs.map(d=>'<div class="tree '+(d.id===S.dlgSel?'sel':'')+'" data-d="'+d.id+'">◇ <span>'+esc(d.title)+'</span><small>'+d.type+'</small></div>').join('')+'<div class="divider"></div><button id="addDlg" style="width:100%">＋ Dialogue node</button><button i
