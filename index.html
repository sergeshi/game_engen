const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const S={mode:'level',objects:[],materials:[{id:'m0',name:'Concrete',color:'#777e88',roughness:.85,metalness:0,opacity:1},{id:'m1',name:'Midnight',color:'#252c3a',roughness:.6,metalness:.1,opacity:1},{id:'m2',name:'Oxide',color:'#b66b48',roughness:.8,metalness:.1,opacity:1},{id:'m3',name:'Signal amber',color:'#f2a65a',roughness:.35,metalness:0,opacity:1}],lights:[],selected:null,history:[],future:[],grid:true,snap:true,dirty:false,flags:{},dlgSel:'start',dialogs:[{id:'start',type:'dialogue',title:'First contact',speaker:'Mara',text:'You look like someone who has misplaced something important. Or someone who has found it.',x:60,y:70,choices:[{text:'Ask where you are.',to:'where',condition:'',effect:''},{text:'Say nothing.',to:'silence',condition:'',effect:''}]},{id:'where',type:'dialogue',title:'Where am I?',speaker:'Mara',text:'The old quarter. The city forgot this place a long time ago. It forgets most things.',x:360,y:50,choices:[{text:'Ask about the city.',to:'end',condition:'',effect:'city_asked = true'},{text:'Leave.',to:'end',condition:'',effect:''}]},{id:'silence',type:'dialogue',title:'Silence',speaker:'Mara',text:'A silence can be an answer. It can also be a threat.',x:360,y:270,choices:[{text:'Continue.',to:'end',condition:'',effect:''}]},{id:'end',type:'end',title:'End conversation',speaker:'',text:'The conversation ends. The world remembers what you said.',x:680,y:140,choices:[]}]};
let scene,camera,renderer,controls,transform,raycaster,mouse,grid,ambient,sun,clock,playerPos=new THREE.Vector3(),keys={},drag=null,dragOff={x:0,y:0};
const root=new THREE.Group(),lightRoot=new THREE.Group();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(t){$('#status').textContent=t}function dirty(){S.dirty=true;$('#saveState').textContent='modified'}

function geo(t){if(t==='Wall')return new THREE.BoxGeometry(4,2.5,.25);if(t==='Floor')return new THREE.BoxGeometry(4,.08,4);if(t==='Sphere')return new THREE.SphereGeometry(.5,20,14);if(t==='Cylinder')return new THREE.CylinderGeometry(.5,.5,1,20);if(t==='Capsule')return new THREE.CapsuleGeometry(.35,1,5,12);if(t==='Stairs')return new THREE.BoxGeometry(1,1,1);return new THREE.BoxGeometry(1,1,1)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color('#242832');scene.fog=new THREE.Fog('#242832',40,130);camera=new THREE.PerspectiveCamera(45,1,.1,500);camera.position.set(11,15,18);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;$('#viewport').appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.maxPolarAngle=Math.PI*.48;ambient=new THREE.HemisphereLight(0xc6d9ff,0x39302b,1.7);scene.add(ambient);sun=new THREE.DirectionalLight(0xffe5c2,2);sun.position.set(8,16,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun,root,lightRoot);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#30353c',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.05;floor.receiveShadow=true;scene.add(floor);grid=new THREE.GridHelper(100,100,'#667080','#3a404a');grid.position.y=-.025;scene.add(grid);transform=new TransformControls(camera,renderer.domElement);transform.addEventListener('dragging-changed',e=>controls.enabled=!e.value);transform.addEventListener('objectChange',()=>{const o=selected();if(o){record(o);syncTransform();dirty()}});scene.add(transform.getHelper());raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();clock=new THREE.Clock();renderer.domElement.addEventListener('pointerdown',pick);window.addEventListener('resize',resize);addObject('Box');addObject('Capsule');animate();resize()}
function resize(){const el=$('#viewport');if(!renderer)return;const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix()}
function addObject(type='Box',position){snapshot();const id='o'+Math.random().toString(36).slice(2,9),m=S.materials[0];let obj;if(type==='Stairs'){obj=new THREE.Group();for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1,.2,1),new THREE.MeshStandardMaterial({color:m.color}));s.position.set(0,-.4+i*.2,-.4+i*.2);s.castShadow=s.receiveShadow=true;obj.add(s)}}else obj=new THREE.Mesh(geo(type),new THREE.MeshStandardMaterial({color:m.color,roughness:m.roughness,metalness:m.metalness}));obj.name=type+' '+(S.objects.filter(o=>o.type===type).length+1);obj.userData={id,type,materialId:m.id};obj.castShadow=obj.receiveShadow=true;obj.position.copy(position||new THREE.Vector3((Math.random()-.5)*4,type==='Wall'?1.25:type==='Floor'?.04:.5,(Math.random()-.5)*4));root.add(obj);S.objects.push({id,name:obj.name,type,position:obj.position.toArray(),rotation:[0,0,0],scale:[1,1,1],materialId:m.id});select(id);hierarchy();dirty();return obj}
function selected(){return root.children.find(o=>o.userData.id===S.selected)}function record(o){const r=S.objects.find(x=>x.id===o.userData.id);if(r){r.position=o.position.toArray();r.rotation=[o.rotation.x,o.rotation.y,o.rotation.z];r.scale=o.scale.toArray()}}
function select(id){S.selected=id;const o=selected();if(o)transform.attach(o);else transform.detach();hierarchy();inspector()}
function pick(e){if(S.mode!=='level')return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(root.children,true).find(h=>h.object.userData.id||h.object.parent?.userData.id);if(hit){let o=hit.object;while(o&&!o.userData.id)o=o.parent;select(o.userData.id);status('Selected '+o.name)}else select(null)}
function hierarchy(){const b=$('#leftBody');if(S.mode==='dialogue'){b.innerHTML='<div class="section">Dialogue nodes</div>'+S.dialogs.map(d=>'<div class="tree '+(d.id===S.dlgSel?'sel':'')+'" data-d="'+d.id+'">◇ <span>'+esc(d.title)+'</span><small>'+d.type+'</small></div>').join('')+'<div class="divider"></div><button id="addDlg" style="width:100%">＋ Dialogue node</button><button id="addEnd" style="width:100%;margin-top:5px">＋ End node</button>';b.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{S.dlgSel=e.dataset.d;hierarchy();graph();inspector()});$('#addDlg').onclick=()=>addDialog('dialogue');$('#addEnd').onclick=()=>addDialog('end');return}
if(S.mode==='materials'){b.innerHTML='<div class="section">Material library</div>'+S.materials.map(m=>'<div class="tree '+(m.id===S.selected?'sel':'')+'" data-m="'+m.id+'">◈ <span>'+esc(m.name)+'</span></div>').join('')+'<button id="newMat" style="width:100%;margin-top:10px">＋ New material</button>';b.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{S.selected=e.dataset.m;hierarchy();inspector()});$('#newMat').onclick=newMaterial;return}
if(S.mode==='lighting'){b.innerHTML='<div class="section">Light sources</div>'+S.lights.map(l=>'<div class="tree" data-l="'+l.id+'">☼ <span>'+esc(l.name)+'</span><small>'+l.type+'</small></div>').join('')+'<button id="newLight" style="width:100%;margin-top:10px">＋ Point light</button><button id="newSpot" style="width:100%;margin-top:5px">＋ Spot light</button>';$('#newLight').onclick=()=>addLight('Point');$('#newSpot').onclick=()=>addLight('Spot');b.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>lightInspector(S.lights.find(l=>l.id===e.dataset.l)));return}
b.innerHTML='<div class="section">Scene · '+S.objects.length+' objects</div>'+S.objects.map(o=>'<div class="tree '+(o.id===S.selected?'sel':'')+'" data-o="'+o.id+'">◧ <span>'+esc(o.name)+'</span><small>'+o.type+'</small></div>').join('')+'<div class="divider"></div><div class="section">Create primitive</div><div class="grid2">'+['Box','Wall','Floor','Capsule','Sphere','Cylinder','Stairs'].map(t=>'<button data-add="'+t+'">＋ '+t+'</button>').join('')+'</div><div class="section">Import model</div><button id="import" style="width:100%">Import GLB / glTF / OBJ</button><input class="file" id="modelFile" type="file" accept=".glb,.gltf,.obj">';b.querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>select(e.dataset.o));b.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>addObject(e.dataset.add));$('#import').onclick=()=>$('#modelFile').click();$('#modelFile').onchange=importModel;$('#count').textContent=S.objects.length+' OBJECTS'}
function inspector(){const b=$('#rightBody');if(S.mode==='dialogue'){dialogInspector();return}if(S.mode==='materials'){const m=S.materials.find(m=>m.id===S.selected)||S.materials[0];$('#badge').textContent='MATERIAL';b.innerHTML='<div class="title">'+esc(m.name)+'</div><div class="swatch" style="background:'+m.color+'"></div><label>Name</label><input id="mn" value="'+esc(m.name)+'"><label>Base color</label><input id="mc" type="color" value="'+m.color+'"><label>Roughness</label><input id="mr" type="range" min="0" max="1" step=".01" value="'+m.roughness+'"><label>Metalness</label><input id="mm" type="range" min="0" max="1" step=".01" value="'+m.metalness+'"><label>Opacity</label><input id="mo" type="range" min=".1" max="1" step=".01" value="'+m.opacity+'"><button id="applyMat" class="primary" style="width:100%;margin-top:12px">Apply to selected object</button><p class="muted small">Texture painting and UV editor are planned. Imported glTF textures are retained where supported.</p>';$('#mn').onchange=e=>{m.name=e.target.value;hierarchy();dirty()};$('#mc').oninput=e=>{m.color=e.target.value;$('.swatch').style.background=m.color;updateMat(m)};$('#mr').oninput=e=>{m.roughness=+e.target.value;updateMat(m)};$('#mm').oninput=e=>{m.metalness=+e.target.value;updateMat(m)};$('#mo').oninput=e=>{m.opacity=+e.target.value;updateMat(m)};$('#applyMat').onclick=()=>applyMat(m.id);return}
if(S.mode==='lighting'){lightingInspector();return}
const o=selected();$('#badge').textContent=o?'OBJECT':'NONE';if(!o){b.innerHTML='<p class="muted small">Select an object to edit its transform, or add a primitive from the left panel.</p><p class="muted small">W move · E rotate · R scale · Delete remove · Ctrl/Cmd+Z undo.</p>';return}const r=S.objects.find(x=>x.id===o.userData.id);b.innerHTML='<div class="title">'+esc(o.name)+'</div><label>Name</label><input id="on" value="'+esc(o.name)+'"><div class="section">Position</div><div class="grid3">'+[0,1,2].map(i=>'<div><div class="axis">'+['X','Y','Z'][i]+'</div><input id="p'+i+'" type="number" step=".1" value="'+o.position.getComponent(i).toFixed(2)+'"></div>').join('')+'</div><label>Rotation · degrees</label><div class="grid3">'+[0,1,2].map(i=>'<div><div class="axis">'+['X','Y','Z'][i]+'</div><input id="r'+i+'" type="number" step="5" value="'+THREE.MathUtils.radToDeg(o.rotation.getComponent(i)).toFixed(1)+'"></div>').join('')+'</div><label>Scale</label><div class="grid3">'+[0,1,2].map(i=>'<input id="s'+i+'" type="number" min=".01" step=".1" value="'+o.scale.getComponent(i).toFixed(2)+'">').join('')+'</div><label>Material</label><select id="om">'+S.materials.map(m=>'<option value="'+m.id+'" '+(m.id===o.userData.materialId?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select><div class="divider"></div><div class="grid3"><button data-tool="translate">Move</button><button data-tool="rotate">Rotate</button><button data-tool="scale">Scale</button></div><div class="grid2" style="margin-top:8px"><button id="dup">Duplicate</button><button id="del">Delete</button></div>';$('#on').onchange=e=>{o.name=e.target.value;r.name=o.name;hierarchy();dirty()};for(let i=0;i<3;i++){ $('#p'+i).onchange=e=>{snapshot();o.position.setComponent(i,+e.target.value);record(o);dirty()};$('#r'+i).onchange=e=>{snapshot();o.rotation.setComponent(i,THREE.MathUtils.degToRad(+e.target.value));record(o);dirty()};$('#s'+i).onchange=e=>{snapshot();o.scale.setComponent(i,Math.max(.01,+e.target.value));record(o);dirty()}}$('#om').onchange=e=>applyMat(e.target.value);b.querySelectorAll('[data-tool]').forEach(e=>e.onclick=()=>transform.setMode(e.dataset.tool));$('#dup').onclick=()=>{const c=addObject(o.userData.type,o.position.clone().add(new THREE.Vector3(1,0,1)));c.rotation.copy(o.rotation);c.scale.copy(o.scale);c.name=o.name+' copy';record(c);hierarchy();dirty()};$('#del').onclick=deleteSelected}
function syncTransform(){const o=selected();if(!o)return;[0,1,2].forEach(i=>{if($('#p'+i))$('#p'+i).value=o.position.getComponent(i).toFixed(2);if($('#r'+i))$('#r'+i).value=THREE.MathUtils.radToDeg(o.rotation.getComponent(i)).toFixed(1);if($('#s'+i))$('#s'+i).value=o.scale.getComponent(i).toFixed(2)})}
function updateMat(m){root.children.forEach(o=>{if(o.userData.materialId===m.id)o.traverse(n=>{if(n.isMesh){n.material.color.set(m.color);n.material.roughness=m.roughness;n.material.metalness=m.metalness;n.material.opacity=m.opacity;n.material.transparent=m.opacity<1}})});dirty()}
function applyMat(id){const m=S.materials.find(x=>x.id===id),o=selected();if(!m||!o)return;o.userData.materialId=id;o.traverse(n=>{if(n.isMesh)n.material=new THREE.MeshStandardMaterial({color:m.color,roughness:m.roughness,metalness:m.metalness,transparent:m.opacity<1,opacity:m.opacity})});const r=S.objects.find(x=>x.id===o.userData.id);if(r)r.materialId=id;dirty()}
function newMaterial(){const m={id:'m'+Math.random().toString(36).slice(2,7),name:'New material',color:'#7e8ca3',roughness:.7,metalness:0,opacity:1};S.materials.push(m);S.selected=m.id;hierarchy();inspector();dirty()}
function addLight(type){snapshot();const id='l'+Math.random().toString(36).slice(2,7),color='#ffd7a1',l=type==='Spot'?new THREE.SpotLight(color,25,18,Math.PI/5):new THREE.PointLight(color,15,15);l.name=type+' Light';l.position.set(2,3,2);l.castShadow=true;l.userData.id=id;lightRoot.add(l);S.lights.push({id,name:l.name,type,color,intensity:l.intensity,distance:l.distance||18,position:l.position.toArray(),castShadow:true});hierarchy();lightInspector(S.lights[S.lights.length-1]);dirty()}
function lightInspector(l){$('#badge').textContent='LIGHT';$('#rightTitle').textContent='Light properties';const b=$('#rightBody');b.innerHTML='<div class="title">'+esc(l.name)+'</div><label>Name</label><input id="ln" value="'+esc(l.name)+'"><label>Color</label><input id="lc" type="color" value="'+l.color+'"><label>Intensity</label><input id="li" type="range" min="0" max="50" value="'+l.intensity+'"><label>Range</label><input id="ld" type="range" min="1" max="40" value="'+l.distance+'"><label>Position XYZ</label><div class="grid3">'+[0,1,2].map(i=>'<input id="lp'+i+'" type="number" step=".25" value="'+l.position[i]+'">').join('')+'</div><button id="dl" style="width:100%;margin-top:12px">Delete light</button>';const obj=lightRoot.children.find(x=>x.userData.id===l.id);$('#ln').onchange=e=>{l.name=e.target.value;if(obj)obj.name=l.name;hierarchy()};$('#lc').oninput=e=>{l.color=e.target.value;if(obj)obj.color.set(l.color)};$('#li').oninput=e=>{l.intensity=+e.target.value;if(obj)obj.intensity=l.intensity};$('#ld').oninput=e=>{l.distance=+e.target.value;if(obj&&'distance'in obj)obj.distance=l.distance};[0,1,2].forEach(i=>$('#lp'+i).onchange=e=>{l.position[i]=+e.target.value;if(obj)obj.position.fromArray(l.position)});$('#dl').onclick=()=>{if(obj)lightRoot.remove(obj);S.lights=S.lights.filter(x=>x.id!==l.id);hierarchy();inspector();dirty()}}

function dialogInspector(){const d=S.dialogs.find(x=>x.id===S.dlgSel);if(!d){$('#rightBody').innerHTML='Select node';return}const b=$('#rightBody');$('#badge').textContent='NODE';b.innerHTML='<div class="title">Dialogue node</div><label>Title</label><input id="dt" value="'+esc(d.title)+'"><label>Type</label><select id="dtype"><option value="dialogue">Dialogue</option><option value="condition">Condition</option><option value="event">Event / effect</option><option value="end">End</option></select><label>Speaker</label><input id="ds" value="'+esc(d.speaker||'')+'"><label>Text / expression</label><textarea id="dx" rows="5">'+esc(d.text||'')+'</textarea><div class="section">Choices / links</div><div id="choices">'+(d.choices||[]).map((c,i)=>'<div style="border:1px solid var(--line);padding:7px;margin:7px 0;border-radius:5px"><label>Player response</label><input data-ct="'+i+'" value="'+esc(c.text)+'"><label>Target node ID</label><input data-cp="'+i+'" value="'+esc(c.to)+'"><label>Condition (optional)</label><input data-cc="'+i+'" value="'+esc(c.condition||'')+'"><label>Effect (optional)</label><input data-ce="'+i+'" value="'+esc(c.effect||'')+'"><button data-cd="'+i+'" style="margin-top:5px">Remove</button></div>').join('')+'</div><button id="addChoice" style="width:100%">＋ Add choice</button><div class="divider"></div><button id="delNode" style="width:100%">Delete node</button><p class="muted small">Conditions/effects are data-driven; the test runtime evaluates simple flag comparisons and assignments.</p>';$('#dtype').value=d.type;[['dt','title'],['dtype','type'],['ds','speaker'],['dx','text']].forEach(([id,k])=>$('#'+id).onchange=e=>{d[k]=e.target.value;hierarchy();graph();dirty()});b.querySelectorAll('[data-ct]').forEach(e=>e.onchange=()=>{d.choices[+e.dataset.ct].text=e.value;graph();dirty()});b.querySelectorAll('[data-cp]').forEach(e=>e.onchange=()=>{d.choices[+e.dataset.cp].to=e.value;graph();dirty()});b.querySelectorAll('[data-cc]').forEach(e=>e.onchange=()=>{d.ch function graph(){const c=$('#nodes');c.innerHTML='';S.dialogs.forEach(d=>{const el=document.createElement('div');el.className='node '+(d.id===S.dlgSel?'sel':'');el.style.left=d.x+'px';el.style.top=d.y+'px';el.innerHTML='<div class="nodehead">'+esc(d.title)+' <small>'+d.type.toUpperCase()+'</small></div><div class="nodebody">'+(d.speaker?'<b style="color:var(--accent)">'+esc(d.speaker)+'</b><br>':'')+esc((d.text||'').slice(0,130))+'</div><div class="nodefoot">'+d.choices.length+' links · '+esc(d.id)+'</div>';el.onpointerdown=e=>{S.dlgSel=d.id;drag=d;dragOff={x:e.clientX-d.x,y:e.clientY-d.y};el.setPointerCapture(e.pointerId);hierarchy();inspector();e.stopPropagation()};el.onpointermove=e=>{if(drag!==d)return;d.x=Math.max(0,e.clientX-dragOff.x);d.y=Math.max(0,e.clientY-dragOff.y);el.style.left=d.x+'px';el.style.top=d.y+'px'};el.onpointerup=()=>{if(drag===d){drag=null;dirty()}};c.appendChild(el)});const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.style.cssText='position:absolute;inset:0;width:1600px;height:1000px;pointer-events:none';S.dialogs.forEach(d=>d.choices.forEach(ch=>{const t=S.dialogs.find(x=>x.id===ch.to);if(!t)return;const p=document.createElementNS(svg.namespaceURI,'path'),x=d.x+215,y=d.y+60,tx=t.x,ty=t.y+30,dx=Math.max(40,Math.abs(tx-x)*.4);p.setAttribute('d','M '+x+' '+y+' C '+(x+dx)+' '+y+', '+(tx-dx)+' '+ty+', '+tx+' '+ty);p.setAttribute('stroke','#8793a4');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.appendChild(p)}));c.prepend(svg)}
function addDialog(type){const id='node'+Math.random().toString(36).slice(2,7);S.dialogs.push({id,type,title:type==='end'?'End':'New dialogue',speaker:'',text:'Write dialogue here…',x:100+Math.random()*400,y:100+Math.random()*300,choices:type==='end'?[]:[{text:'Continue',to:S.dialogs[0]?.id||'start',condition:'',effect:''}]});S.dlgSel=id;hierarchy();graph();inspector();dirty()}
function setMode(mode){if(S.play&&mode!=='play'){S.play=false;$('#overlay').classList.add('hidden');controls.enabled=true}S.mode=mode;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#leftTitle').textContent=mode==='dialogue'?'Dialogue nodes':mode==='materials'?'Materials':mode==='lighting'?'Light sources':'Scene hierarchy';$('#rightTitle').textContent=mode==='dialogue'?'Node inspector':mode==='materials'?'Material inspector':mode==='lighting'?'Lighting':'Inspector';$('#viewport').classList.toggle('hidden',mode==='dialogue');$('#nodes').classList.toggle('hidden',mode!=='dialogue');$('#tools').classList.toggle('hidden',mode==='dialogue'||mode==='play');$('#hud').classList.toggle('hidden',mode==='dialogue'||mode==='play');if(mode==='play')startPlay();hierarchy();inspector();if(mode==='dialogue')graph()}
function startPlay(){S.play=true;playerPos.set(0,0,0);controls.enabled=false;transform.detach();$('#overlay').classList.remove('hidden');$('#dialogBox').innerHTML='<div class="speaker">GAME ENGEN · PLAY TEST</div><h2>Enter the world</h2><p class="muted">Move with WASD / arrows. Walk near a capsule and press E to talk. Esc returns to the editor.</p><button id="begin" class="primary">Begin</button> <button id="exit">Back to editor</button>';$('#begin').onclick=()=>{$('#dialogBox').innerHTML='<div class="speaker">FIELD TEST</div><h2>Find someone to talk to</h2><p class="muted">WASD / arrows · E interact · Esc exit</p><p id="hint" style="color:var(--accent)">Walk toward the capsule marker.</p><button id="exit">Back to editor</button>';$('#exit').onclick=stopPlay}}

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(S.play&&$('#hint')){let dx=0,dz=0;if(keys.KeyW||keys.ArrowUp)dz-=dt*4;if(keys.KeyS||keys.ArrowDown)dz+=dt*4;if(keys.KeyA||keys.ArrowLeft)dx-=dt*4;if(keys.KeyD||keys.ArrowRight)dx+=dt*4;playerPos.x+=dx;playerPos.z+=dz;camera.position.add(new THREE.Vector3(dx,0,dz));controls.target.set(playerPos.x,0,playerPos.z);const cap=root.children.find(o=>o.userData.type==='Capsule');if(cap&&cap.position.distanceTo(playerPos)<2.4){$('#hint').textContent='Press E to talk'}else $('#hint').textContent='Walk toward the capsule marker.';if(keys.KeyE&&cap&&cap.position.distanceTo(playerPos)<2.4){keys.KeyE=false;runDialog(S.dialogs[0]?.id||'start')}}controls?.update();renderer?.render(scene,camera)}
