name: Python prototype checks

on:
  push:
    paths:
      - "python_prototype/**"
      - "legacy_web/**"
      - "legacy_web/app.js"
      - "legacy_web/state.js"
      - "legacy_web/styles.css"
      - "engine/**"
      - "tests/**"
      - "package.json"
      - "desktop.py"
      - "main.py"
      - "requirements.txt"
      - "RUN_GAME_ENGEN.bat"
      - ".github/workflows/python-prototype.yml"
  pull_request:
    paths:
      - "python_prototype/**"
      - "legacy_web/**"
      - "desktop.py"
      - "main.py"
      - "requirements.txt"
      - "RUN_GAME_ENGEN.bat"
      - ".github/workflows/python-prototype.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q main.py desktop.py python_prototype
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check modular editor JavaScript syntax
        run: node --check legacy_web/app.js && node --check legacy_web/state.js
      - name: Check dialogue graph module syntax
        run: cp legacy_web/dialogue_system.js /tmp/dialogue_system.mjs && node --check /tmp/dialogue_system.mjs
      - name: Check performance utilities syntax
        run: cp legacy_web/performance_tools.js /tmp/performance_tools.mjs && node --check /tmp/performance_tools.mjs
      - name: Run JavaScript regression tests
        run: npm test
      - name: Test renderer-independent Python core
        run: python -m unittest discover -s python_prototype/tests -v
