name: Python prototype checks

on:
  push:
    paths:
      - "python_prototype/**"
      - ".github/workflows/python-prototype.yml"
  pull_request:
    paths:
      - "python_prototype/**"
      - ".github/workflows/python-prototype.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Test renderer-independent core
        run: python -m unittest discover -s tests -v
