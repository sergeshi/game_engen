name: Python prototype checks

on:
  push:
    paths:
      - "python_prototype/**"
      - "desktop.py"
      - "main.py"
      - "requirements.txt"
      - "RUN_GAME_ENGEN.bat"
      - ".github/workflows/python-prototype.yml"
  pull_request:
    paths:
      - "python_prototype/**"
      - "desktop.py"
      - "main.py"
      - "requirements.txt"
      - "RUN_GAME_ENGEN.bat"
      - ".github/workflows/python-prototype.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q main.py desktop.py python_prototype
      - name: Test renderer-independent core
        run: python -m unittest discover -s python_prototype/tests -v
